429 231L529 231" stroke="#936142" stroke-width="2" stroke-dasharray="6 6"/><path d="M465 313L565 313" stroke="#936142" stroke-width="2" stroke-dasharray="6 6"/><path d="M531 235L563 309" fill="none" stroke="#234b38" stroke-width="4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><circle cx="429" cy="231" r="7" fill="#936142" stroke="#fff" stroke-width="2"/><circle cx="465" cy="313" r="7" fill="#936142" stroke="#fff" stroke-width="2"/><rect x="567" y="249" width="58" height="44" rx="10" fill="#234b38"/><text x="596" y="281" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="bold" fill="white">E</text><text x="52" y="57" font-family="Arial,sans-serif" font-size="22" fill="#234b38">Resting on the side, viewed from above</text></g></svg>
