09 12.7</text><rect x="293.7" y="110.0" width="10.7" height="10.7" fill="#254b38" stroke="#26332c" stroke-width=".6"/><rect x="293.7" y="414.7" width="10.7" height="10.7" fill="#254b38" stroke="#26332c" stroke-width=".6"/><text x="299.1" y="133.7" font-size="9" text-anchor="middle" fill="#14201a">C03 axle 545.4</text><rect x="584.7" y="110.0" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><rect x="584.7" y="414.7" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><text x="590.0" y="133.7" font-size="9" text-anchor="middle" fill="#14201a">C09 1238.1</text><rect x="658.1" y="110.0" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><rect x="658.1" y="414.7" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><text x="663.4" y="133.7" font-size="9" text-anchor="middle" fill="#14201a">C15 1412.95</text><rect x="658.1" y="110.0" width="10.7" height="315.3" fill="none" stroke="#26332c" stroke-width=".6" stroke-dasharray="5 4"/><rect x="694.1" y="110.0" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><rect x="694.1" y="414.7" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><rect x="694.1" y="110.0" width="10.7" height="315.3" fill="none" stroke="#26332c" stroke-width=".6" stroke-dasharray="5 4"/><circle cx="681.4" cy="267.7" r="77.7" fill="none" stroke="#8b3852" stroke-width=".7" stroke-dasharray="3 4"/><text x="681.4" y="271.7" font-size="9" text-anchor="middle" fill="#8b3852">caster</text><text x="681.4" y="441.3" font-size="9" text-anchor="middle" fill="#14201a">C16 beams above, at 1412.95 and 1498.65</text><rect x="218.0" y="65.3" width="162.0" height="33.3" fill="none" stroke="#26332c" stroke-width=".6" stroke-dasharray="2 3"/><rect x="218.0" y="436.7" width="162.0" height="33.3" fill="none" stroke="#26332c" stroke-width=".6" stroke-dasharray="2 3"/><path d="M70.0 471.33599999999996H733.0M70.0 466.33599999999996v10M733.0 466.33599999999996v10" stroke="#8b3852" stroke-width=".7" fill="none"/><text x="401.5" y="466.3" font-size="10" text-anchor="middle" fill="#8b3852">C01 base side rail, cut 1578.65, two of them</text><text x="62.0" y="267.7" font-size="10" text-anchor="end" fill="#8b3852">REAR</text><text x="741.0" y="267.7" font-size="10" text-anchor="start" fill="#8b3852">FRONT</text><text x="70.0" y="559.3" font-size="10" text-anchor="start" fill="#14201a">Cross members are cut 700. Outside width over the rails is 750.8. Rail centerlines are 725.4 apart.</text><text x="70.0" y="575.3" font-size="10" text-anchor="start" fill="#14201a">Every number after "at" is the centerline of that member, measured along the rail from its REAR end.</text><text x="70.0" y="591.3" font-size="10" text-anchor="start" fill="#14201a">Corner gussets go under each corner, tee gussets under each C14, axle hangers on both side faces at the axle post. Hole centers are in drilling.csv.</text></svg>
