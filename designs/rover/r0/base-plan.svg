<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 905 605" width="1448" height="969" font-family="Arial, sans-serif"><rect width="100%" height="100%" fill="#fff"/><text x="70.0" y="26.0" font-size="14" text-anchor="start" fill="#14201a">Buddy Rover r0 base frame plan, seen from above, mm</text><text x="70.0" y="42.0" font-size="9" text-anchor="start" fill="#14201a">Bench design, not for animal use. Solid squares are posts standing on the rails. Dashed outlines are parts above or beside the base.</text><rect x="70.0" y="110.0" width="705.0" height="10.7" fill="#b4bfb8" stroke="#26332c" stroke-width=".6"/><rect x="70.0" y="414.7" width="705.0" height="10.7" fill="#b4bfb8" stroke="#26332c" stroke-width=".6"/><rect x="70.0" y="120.7" width="10.7" height="294.0" fill="#b4bfb8" stroke="#26332c" stroke-width=".6"/><text x="75.3" y="281.7" font-size="9" text-anchor="middle" fill="#14201a">C02 at 12.7</text><rect x="209.2" y="120.7" width="10.7" height="294.0" fill="#dfe6e1" stroke="#26332c" stroke-width=".6"/><text x="214.5" y="253.7" font-size="9" text-anchor="middle" fill="#14201a">C14 at 344.05</text><rect x="350.4" y="120.7" width="10.7" height="294.0" fill="#dfe6e1" stroke="#26332c" stroke-width=".6"/><text x="355.8" y="281.7" font-size="9" text-anchor="middle" fill="#14201a">C14 at 680.4</text><rect x="487.5" y="120.7" width="10.7" height="294.0" fill="#dfe6e1" stroke="#26332c" stroke-width=".6"/><text x="492.8" y="253.7" font-size="9" text-anchor="middle" fill="#14201a">C14 at 1006.75</text><rect x="626.7" y="120.7" width="10.7" height="294.0" fill="#b4bfb8" stroke="#26332c" stroke-width=".6"/><text x="632.0" y="281.7" font-size="9" text-anchor="middle" fill="#14201a">C02 at 1338.1</text><rect x="70.0" y="110.0" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><rect x="70.0" y="414.7" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><text x="75.3" y="133.7" font-size="9" text-anchor="middle" fill="#14201a">C09 12.7</text><rect x="310.5" y="110.0" width="10.7" height="10.7" fill="#254b38" stroke="#26332c" stroke-width=".6"/><rect x="310.5" y="414.7" width="10.7" height="10.7" fill="#254b38" stroke="#26332c" stroke-width=".6"/><text x="315.9" y="133.7" font-size="9" text-anchor="middle" fill="#14201a">C03 axle 585.4</text><rect x="626.7" y="110.0" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><rect x="626.7" y="414.7" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><text x="632.0" y="133.7" font-size="9" text-anchor="middle" fill="#14201a">C21 foot 1338.1</text><rect x="700.1" y="110.0" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><rect x="700.1" y="414.7" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><text x="705.4" y="133.7" font-size="9" text-anchor="middle" fill="#14201a">C15 1512.95</text><rect x="700.1" y="110.0" width="10.7" height="315.3" fill="none" stroke="#26332c" stroke-width=".6" stroke-dasharray="5 4"/><rect x="736.1" y="110.0" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><rect x="736.1" y="414.7" width="10.7" height="10.7" fill="#6d7a72" stroke="#26332c" stroke-width=".6"/><rect x="736.1" y="110.0" width="10.7" height="315.3" fill="none" stroke="#26332c" stroke-width=".6" stroke-dasharray="5 4"/><circle cx="723.4" cy="267.7" r="77.7" fill="none" stroke="#8b3852" stroke-width=".7" stroke-dasharray="3 4"/><text x="723.4" y="271.7" font-size="9" text-anchor="middle" fill="#8b3852">caster</text><text x="723.4" y="441.3" font-size="9" text-anchor="middle" fill="#14201a">C16 beams above, at 1512.95 and 1598.65</text><rect x="234.8" y="65.3" width="162.0" height="33.3" fill="none" stroke="#26332c" stroke-width=".6" stroke-dasharray="2 3"/><rect x="234.8" y="436.7" width="162.0" height="33.3" fill="none" stroke="#26332c" stroke-width=".6" stroke-dasharray="2 3"/><path d="M70.0 471.33599999999996H775.0M70.0 466.33599999999996v10M775.0 466.33599999999996v10" stroke="#8b3852" stroke-width=".7" fill="none"/><text x="422.5" y="466.3" font-size="10" text-anchor="middle" fill="#8b3852">C01 base side rail, cut 1678.65, two of them</text><text x="62.0" y="267.7" font-size="10" text-anchor="end" fill="#8b3852">REAR</text><text x="783.0" y="267.7" font-size="10" text-anchor="start" fill="#8b3852">FRONT</text><text x="70.0" y="559.3" font-size="10" text-anchor="start" fill="#14201a">Cross members are cut 700. Outside width over the rails is 750.8. Rail centerlines are 725.4 apart.</text><text x="70.0" y="575.3" font-size="10" text-anchor="start" fill="#14201a">Every number after "at" is the centerline of that member, measured along the rail from its REAR end.</text><text x="70.0" y="591.3" font-size="10" text-anchor="start" fill="#14201a">Every joint here is welded all round. Axle hangers bolt to both side faces at the axle post. Welds are in weld-schedule.csv, holes in drilling.csv.</text></svg>
